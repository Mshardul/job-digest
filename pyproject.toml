[project]
name = "job-digest"
version = "0.1.0"
description = "Fetch, filter, score, and email remote job listings."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Job Digest contributors" }]
dependencies = [
  "alembic",
  "feedparser",
  "httpx",
  "pydantic>=2",
  "SQLAlchemy>=2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
  "pyyaml>=6",
  "types-PyYAML>=6",
]

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
  "pyyaml>=6",
  "types-PyYAML>=6",
]

[project.scripts]
job-digest = "job_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["job_digest"]
warn_unused_configs = true
